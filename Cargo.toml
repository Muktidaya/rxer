[package]
name = "rxer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lean terminal audio receiver and router"
license = "Apache-2.0"
repository = "https://github.com/Muktidaya/rxer"
readme = "README.md"
keywords = ["audio", "radio", "terminal", "streaming", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "assets/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
ctrlc = "3.5"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-isomp4"] }
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }

serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
url = "2"
encoding_rs = "0.8"
aes = "0.8"
cbc = "0.1"
mpeg2ts-reader = "0.18.2"

[profile.release]
lto = "thin"
strip = true
